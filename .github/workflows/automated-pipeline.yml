name: Automated Market Pipeline

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  PRODUCTION_BACKEND_URL: https://koranaestate.onrender.com

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required scheduler secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Trigger production pipeline API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BACKEND_BASE="${PRODUCTION_BACKEND_URL%/}"
          TARGET_URL="$BACKEND_BASE/api/v1/jobs/prices/run"
          echo "Triggering daily pipeline at $TARGET_URL"
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 5 \
            --max-time 300 \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | tee /tmp/pipeline.json
