name: Automated Market Pipeline (DISABLED — replaced by coffee-daily.yml)

# This workflow previously triggered the scraper inside Render, which fails on
# the free tier due to cold-start timeouts and memory limits. The scraper now
# runs in GitHub Actions (coffee-daily.yml) and only POSTs results to Render.
on:
  workflow_dispatch:  # manual only — not scheduled

env:
  PRODUCTION_BACKEND_URL: https://koranaestate.onrender.com

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required scheduler secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Trigger production pipeline API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BACKEND_BASE="${PRODUCTION_BACKEND_URL%/}"
          TARGET_URL="$BACKEND_BASE/api/v1/jobs/prices/run"
          echo "Triggering daily pipeline at $TARGET_URL"
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 5 \
            --max-time 300 \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | tee /tmp/pipeline.json
