name: Automated Market Pipeline

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing required secret: BACKEND_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Trigger production pipeline API
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BACKEND_BASE="${BACKEND_URL%/}"
          curl --fail --show-error --silent \
            -X POST "$BACKEND_BASE/api/v1/jobs/prices/run" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | tee /tmp/pipeline.json
