name: Coffee Board Daily Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST (primary run)
    - cron: '30 4 * * *'   # 10:00 AM IST (backup run — fixes cold start / late PDF)
  workflow_dispatch:

jobs:
  scrape-coffee-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "[ERROR] BACKEND_URL or CRON_SECRET secrets not configured"
            exit 1
          fi
          echo "[OK] Secrets configured"

      - name: Wake up backend (3x ping for Render cold start)
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          echo "[WARM-UP] Ping 1/3..."
          curl -s --max-time 30 "$BACKEND_URL/api/v1/health" && echo " OK" || echo " (no response yet)"
          sleep 10
          echo "[WARM-UP] Ping 2/3..."
          curl -s --max-time 30 "$BACKEND_URL/api/v1/health" && echo " OK" || echo " (waking up...)"
          sleep 10
          echo "[WARM-UP] Ping 3/3..."
          curl -s --max-time 30 "$BACKEND_URL/api/v1/health" && echo " OK" || echo " (slow start)"
          sleep 10
          echo "[WARM-UP] Done — backend should be ready"

      - name: Run coffee price scraper
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "[SCRAPER] Triggering at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          HTTP_CODE=$(curl -s -w "%{http_code}" -X POST \
            "$BACKEND_URL/api/v1/jobs/prices/run" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -o /tmp/response.json)

          echo "[RESPONSE] HTTP $HTTP_CODE"

          # Parse and log key fields
          python3 - << 'EOF'
          import json, sys
          try:
              d = json.load(open('/tmp/response.json'))
              print(f"[RESULT] ok={d.get('ok')} mode={d.get('mode')} carriedForward={d.get('carriedForward', False)}")
              sc = d.get('scraper', {})
              print(f"[SCRAPER] attempt={sc.get('attempt')} observations={sc.get('observations')} durationMs={sc.get('durationMs')}ms")
              run = (d.get('ingest') or {}).get('run', {})
              print(f"[RUN] status={run.get('status','n/a')} success={run.get('successfulCount','n/a')} failed={run.get('failedCount','n/a')}")
              if d.get('carriedForward'):
                  print("[WARN] Used fallback (DEGRADED) — today's PDF may not be available yet")
          except Exception as e:
              print(f"[WARN] Could not parse response: {e}")
          EOF

          # Fail the step if HTTP error
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "[FAIL] HTTP $HTTP_CODE — scraper did not accept the request"
            cat /tmp/response.json
            exit 1
          fi

          echo "[DONE] Scraper finished at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Alert on failure
        if: failure()
        run: |
          echo "[ALERT] Coffee Board scraper FAILED at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "[DEBUG] Check backend logs and GitHub Actions output above"
          # Optional Slack webhook (set SLACK_WEBHOOK secret to enable)
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"🚨 Coffee Board scraper failed on $(date -u '+%Y-%m-%d'). Check GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions\"}"
          fi

