name: Coffee Board Daily Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST (primary run)
    - cron: '30 4 * * *'   # 10:00 AM IST (backup run — late PDF)
    - cron: '30 5 * * *'   # 11:00 AM IST (final backup — very late PDF)
  workflow_dispatch:

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "[ERROR] BACKEND_URL or CRON_SECRET secrets not configured"
            exit 1
          fi
          echo "[OK] Secrets configured"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/price-collector/requirements.txt

      - name: Install Python dependencies
        working-directory: services/price-collector
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: services/price-collector
        run: python -m playwright install chromium --with-deps

      - name: Run coffee price scraper
        id: scraper
        working-directory: services/price-collector
        run: |
          echo "[SCRAPER] Starting at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 src/main.py > /tmp/scraper_output.json
          echo "[SCRAPER] Finished at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # Validate output is valid JSON
          python3 -c "
          import json, sys
          with open('/tmp/scraper_output.json') as f:
              data = json.load(f)
          items = data.get('items', [])
          ok_items = [i for i in items if i.get('value') is not None]
          print(f'[SCRAPER] Got {len(ok_items)}/{len(items)} prices')
          for i in ok_items:
              print(f'  {i[\"productKey\"]}: {i[\"value\"]} {i.get(\"unit\",\"INR/kg\")}')
          if not ok_items:
              print('[WARN] No prices extracted — PDF may not be available yet')
              sys.exit(0)
          "

      - name: Wake up Render backend
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          echo "[WARM-UP] Pinging Render to wake from sleep..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BACKEND_URL/api/v1/health" || echo "000")
            echo "[WARM-UP] Ping $i/5 → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "[WARM-UP] Backend is awake!"
              break
            fi
            sleep 15
          done

      - name: Post prices to backend
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          # Convert scraper output to ingest-observations payload
          python3 - << 'EOF'
          import json, sys
          from datetime import datetime, timezone

          with open('/tmp/scraper_output.json') as f:
              data = json.load(f)

          items = data.get('items', [])
          errors = data.get('errors', [])
          # runAt = when this pipeline actually executed (used for freshness check)
          run_at = datetime.now(timezone.utc).isoformat()
          # reportDate = date stated in the PDF (used as capturedAt per observation)
          report_date = data.get('fetchedAt') or run_at

          observations = []
          for item in items:
              if item.get('value') is None:
                  continue
              obs = {
                  'productKey': item['productKey'],
                  'price': float(item['value']),
                  'unit': item.get('unit', 'INR/kg'),
                  'source': item.get('source', 'Coffee Board India'),
                  'sourceUrl': item.get('sourceUrl', 'https://coffeeboard.gov.in/Market_Info.aspx'),
                  'observedAt': report_date,
                  'rawText': item.get('rawText'),
                  'confidence': item.get('confidence'),
              }
              if item.get('priceMin50kg') is not None:
                  obs['priceMin'] = float(item['priceMin50kg'])
              if item.get('priceMax50kg') is not None:
                  obs['priceMax'] = float(item['priceMax50kg'])
              observations.append(obs)

          ingest_errors = []
          for err in (errors or []):
              ingest_errors.append({
                  'productKey': err.get('productKey', 'unknown'),
                  'error': err.get('error', 'Unknown error'),
                  'sourceUrl': err.get('sourceUrl', 'https://coffeeboard.gov.in/Market_Info.aspx'),
              })

          payload = {
              'runAt': run_at,
              'observations': observations,
              'errors': ingest_errors,
          }

          with open('/tmp/ingest_payload.json', 'w') as f:
              json.dump(payload, f)

          print(f"[INGEST] Prepared {len(observations)} observations for POST")
          if not observations:
              print("[SKIP] No observations — skipping ingest (PDF not yet available)")
              sys.exit(0)
          EOF

          # Only POST if we have observations
          if [ ! -f /tmp/ingest_payload.json ]; then
            echo "[SKIP] No ingest payload — done"
            echo "SKIPPED" > /tmp/pipeline_status.txt
            exit 0
          fi

          OBS_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/ingest_payload.json')); print(len(d.get('observations', [])))")
          if [ "$OBS_COUNT" = "0" ]; then
            echo "[SKIP] 0 observations — PDF not yet published today"
            echo "SKIPPED" > /tmp/pipeline_status.txt
            exit 0
          fi

          echo "[INGEST] POSTing $OBS_COUNT observations to backend..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -X POST \
            "$BACKEND_URL/api/v1/prices/ingest-observations" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @/tmp/ingest_payload.json \
            --max-time 60 \
            -o /tmp/ingest_response.json)

          echo "[INGEST] HTTP $HTTP_CODE"
          cat /tmp/ingest_response.json | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              run = d.get('run') or {}
              print(f\"[DB] status={run.get('status','n/a')} success={run.get('successfulCount','n/a')} failed={run.get('failedCount','n/a')}\")
          except:
              pass
          "

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "[FAIL] Ingest returned HTTP $HTTP_CODE"
            cat /tmp/ingest_response.json
            exit 1
          fi

          echo "[DONE] Prices saved to database at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Alert on failure or skip
        if: failure() || (success() && hashFiles('/tmp/pipeline_status.txt') != '')
        run: |
          if [ -f /tmp/pipeline_status.txt ]; then
            echo "[ALERT] Coffee Board scraper SKIPPED (no data) at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            ALERT_MSG="⚠️ Coffee Board scraper found no data (PDF not published?) on $(date -u '+%Y-%m-%d'). Check GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions"
          else
            echo "[ALERT] Coffee Board scraper FAILED at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            ALERT_MSG="🚨 Coffee Board scraper failed on $(date -u '+%Y-%m-%d'). Check GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions"
          fi
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"$ALERT_MSG\"}"
          fi

